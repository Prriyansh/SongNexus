name: Bug report
description: Something in SongNexus does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations: {required: true}
  - type: input
    id: where
    attributes:
      label: Where
      description: The page link or API request, e.g. `/artists/…` or `GET /v1/artists/…`.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Windows 11
