name: CI

# The app's API (server/), web app (web/) and end-to-end journeys, plus the song_compare
# sound & lyrics service. Runs on every pull request and every push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: songnexus
          POSTGRES_PASSWORD: songnexus
          POSTGRES_DB: songnexus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U songnexus"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy src tests
      - name: Layering
        run: uv run lint-imports
      - name: Tests (SQLite + PostgreSQL + golden data)
        env:
          SONGNEXUS_TEST_DATABASE_URL: postgresql+psycopg://songnexus:songnexus@localhost:5432/songnexus_test
        run: uv run pytest --cov --cov-report=term
      - name: OpenAPI contract is up to date
        run: uv run songnexus openapi --check
      - name: Dependency audit
        run: uvx pip-audit --strict --progress-spinner off -r <(uv export --format requirements-txt --no-hashes --no-dev --no-emit-project)

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: API types match the contract
        run: npm run api:types && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle budget (initial JS ≤ 200 KB gzip)
        run: node scripts/check-bundle-size.mjs
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [server, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the catalog and start the API
        working-directory: server
        env:
          SONGNEXUS_DATABASE_URL: sqlite:////tmp/e2e.db
          SONGNEXUS_ALLOWED_ORIGINS: '["http://127.0.0.1:4273"]'
        run: |
          uv sync --locked --no-dev
          uv run songnexus ingest > /dev/null
          uv run uvicorn songnexus.service.app:create_app --factory --port 8790 --no-access-log > /tmp/api.log 2>&1 &
      - name: Build and serve the web app
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npx vite preview --host 127.0.0.1 --port 4273 --strictPort &
          # http-get: /healthz answers GET only (wait-on's default HEAD gets a 400),
          # and the timeout fails the step instead of waiting until the job limit.
          npx --yes wait-on@8 --timeout 120000 http-get://127.0.0.1:8790/healthz http-get://127.0.0.1:4273
      - name: Journeys and accessibility (mobile + desktop)
        working-directory: web
        run: npx playwright test
      - name: API log
        if: failure()
        run: cat /tmp/api.log || true

  song-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: song_compare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: song_compare/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
