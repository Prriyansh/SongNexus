name: Discover

# What ci.yml doesn't run for Discover: the browser tests and the catalog export's tests.
on:
  push:
    branches: [main]
    paths:
      - "src/discover/**"
      - "src/app/discover/**"
      - "src/app/api/discover/**"
      - "src/app/api/health/**"
      - "next.config.ts"
      - "package.json"
      - "src/frontend/App.tsx"
      - "scripts/discover/**"
      - "e2e/**"
      - "package-lock.json"
      - ".github/workflows/discover.yml"
  pull_request:
    paths:
      - "src/discover/**"
      - "src/app/discover/**"
      - "src/app/api/discover/**"
      - "src/app/api/health/**"
      - "next.config.ts"
      - "package.json"
      - "src/frontend/App.tsx"
      - "scripts/discover/**"
      - "e2e/**"
      - "package-lock.json"
      - ".github/workflows/discover.yml"

permissions:
  contents: read

concurrency:
  group: discover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install coverage
      - run: python -m coverage run --rcfile=scripts/discover/.coveragerc -m unittest discover -s scripts/discover
      - run: python -m coverage report --rcfile=scripts/discover/.coveragerc # fails below 100%

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-traces
          path: e2e/test-results/
          retention-days: 7
