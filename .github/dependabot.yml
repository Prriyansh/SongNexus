# Weekly dependency updates, one pull request per ecosystem (minor and patch grouped;
# majors arrive on their own so they can be reviewed separately).
version: 2
updates:
  - package-ecosystem: uv
    directory: /server
    schedule: {interval: weekly, day: monday}
    groups:
      server-minor-and-patch: {update-types: [minor, patch]}
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly, day: monday}
    groups:
      web-minor-and-patch: {update-types: [minor, patch]}
  - package-ecosystem: pip
    directory: /song_compare
    schedule: {interval: weekly, day: monday}
    groups:
      song-compare-minor-and-patch: {update-types: [minor, patch]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      actions: {patterns: ["*"]}
