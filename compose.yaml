services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: songnexus
      POSTGRES_DB: songnexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or .env}
    volumes:
      - music-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U songnexus -d songnexus"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://songnexus:${POSTGRES_PASSWORD}@db:5432/songnexus
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  music-data:
